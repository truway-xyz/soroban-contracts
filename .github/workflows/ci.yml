name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Keep in sync with rust-toolchain.toml.
  RUST_TOOLCHAIN: 1.96.0
  STELLAR_CLI_VERSION: 23.0.0

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  build:
    name: Build WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
      - name: Install Stellar CLI
        run: |
          # Prebuilt binary: faster than `cargo install`, and the CLI's pinned
          # dependency tree does not always compile with newer rustc releases.
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libudev-dev pkg-config
          mkdir -p "$HOME/.local/bin"
          curl -sSfL "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" stellar
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: stellar --version
      - name: Build
        run: ./scripts/build.sh | tee wasm-sizes.txt
      - name: Report WASM sizes
        run: |
          {
            echo '### WASM sizes'
            echo '```'
            cat wasm-sizes.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: target/wasm32v1-none/release/*.wasm
          if-no-files-found: error

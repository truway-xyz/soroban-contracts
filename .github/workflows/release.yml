name: Release

# Verified builds (SEP-55, Contract Build Verification). On a version tag, GitHub
# builds budget-treasury, attests the WASM and publishes it as a release asset.
# Explorers read `source_repo` from the contract meta, fetch the attestation for
# the deployed WASM hash and show the commit it was built from.
#
# Deploy only the WASM attached to the release (scripts/deploy.sh --wasm), never a
# local build: a local build has a different hash and will not verify.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_name:
        description: "Release name, e.g. v0.4.0"
        required: true
        type: string

permissions:
  id-token: write
  contents: write
  attestations: write

env:
  CARGO_TERM_COLOR: always
  # Same versions as ci.yml, so the release builds what CI tested.
  RUST_TOOLCHAIN: 1.96.0
  STELLAR_CLI_VERSION: 27.0.0

jobs:
  release:
    name: Build, attest and release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32v1-none
      - name: Install Stellar CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libudev-dev pkg-config
          mkdir -p "$HOME/.local/bin"
          curl -sSfL "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" stellar
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Test
        run: cargo test --workspace
      - name: Build
        run: |
          stellar contract build --package budget-treasury \
            --meta source_repo=github:${{ github.repository }}
          stellar contract info meta --wasm target/wasm32v1-none/release/budget_treasury.wasm
      - name: Name the release
        id: name
        run: echo "tag=${{ inputs.release_name || github.ref_name }}" >> "$GITHUB_OUTPUT"
      - name: Prepare asset
        run: |
          mkdir -p dist
          cp target/wasm32v1-none/release/budget_treasury.wasm \
            "dist/budget_treasury_${{ steps.name.outputs.tag }}.wasm"
          (cd dist && sha256sum ./*.wasm | tee SHA256SUMS)
      - name: Ask explorers to verify the build
        # Same call as stellar-expert/soroban-build-workflow: Stellar Expert accepts it
        # only from GitHub Actions runners, then matches the WASM hash with this run.
        run: |
          hash=$(sha256sum dist/*.wasm | cut -d' ' -f1)
          for net in public testnet; do
            curl -s --max-time 15 -X POST "https://api.stellar.expert/explorer/$net/contract-validation/match" \
              -H 'Content-Type: application/json' \
              -d "{\"repository\":\"${{ github.server_url }}/${{ github.repository }}\",\"commitHash\":\"${{ github.sha }}\",\"jobId\":\"${{ github.job }}\",\"runId\":\"${{ github.run_id }}\",\"contractHash\":\"$hash\",\"packageName\":\"budget-treasury\"}" || true
            echo
          done
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.wasm
      - uses: actions/upload-artifact@v4
        with:
          name: budget-treasury-${{ steps.name.outputs.tag }}
          path: dist/
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.name.outputs.tag }}" dist/* \
            --title "budget-treasury ${{ steps.name.outputs.tag }}" \
            --notes "Verified build (SEP-55) of budget-treasury, Proof of Spend reference implementation. Deploy this WASM with scripts/deploy.sh --wasm." \
            --target "${{ github.sha }}" --prerelease

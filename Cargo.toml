[workspace]
resolver = "2"
members = ["contracts/*", "packages/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/truway-xyz/soroban-contracts"
homepage = "https://truway.xyz"
authors = ["Truway <info@truway.xyz>"]
publish = false

[workspace.dependencies]
soroban-sdk = "23.0.0"
truway-common = { path = "packages/common" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

# Same as release, with logs enabled, for debugging on testnet.
[profile.release-with-logs]
inherits = "release"
debug-assertions = true
